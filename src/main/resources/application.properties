spring.application.name=type_service
spring.config.import=optional:file:.env[.properties]

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__create_and_normalize_words_table.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.api-prefix=${APP_API_PREFIX:/api/v1}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenRouter (AI) configuration
app.openrouter.enabled=${APP_OPENROUTER_ENABLED:false}
app.openrouter.api-key=${APP_OPENROUTER_API_KEY}
app.openrouter.base-url=${APP_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.openrouter.model=${APP_OPENROUTER_MODEL:openrouter/auto}
app.openrouter.site-url=${APP_OPENROUTER_SITE_URL}
app.openrouter.app-name=type_service

# Word types and their corresponding colours
word-types.colours.noun=#FF5733
word-types.colours.verb=#008D00
word-types.colours.adjective=#3377FF
word-types.colours.adverb=#F1C40F
word-types.colours.pronoun=#8E44AD
word-types.colours.preposition=#E67E22
word-types.colours.interjection=#1ABC9C
word-types.colours.conjunction=#D35400
word-types.colours.determiner=#DC3EA0